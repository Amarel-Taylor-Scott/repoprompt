[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprompt"
version = "0.1.0"
description = "Pack a code repository into one LLM-ready prompt — gitignore-aware, token-budgeted, file tree + fenced files, optional Python signatures-only map. Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["llm", "prompt", "context", "repository", "codebase", "rag", "gitignore", "agents", "tokens"]
dependencies = []

[project.scripts]
repoprompt = "repoprompt.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["repoprompt"]
